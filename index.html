<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🏎️ سباق الشوارع</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  margin: 15px 0;
}

h2 {
  margin-top: 10px;
}

/* =========================
   الجراج
========================= */

#garage {
  width: 95%;
  max-width: 600px;
  margin: auto;
}

.cars {
  display: flex;
  gap: 15px;
  overflow-x: auto;
  padding: 10px;
}

.car {
  min-width: 240px;
  background: #222;
  border: 3px solid #444;
  border-radius: 15px;
  padding: 10px;
  transition: .2s;
}

.car.selected {
  border-color: #08f;
  box-shadow: 0 0 20px #087cff;
  transform: scale(1.03);
}

.car img {
  width: 100%;
  height: 150px;
  object-fit: cover;
  border-radius: 10px;
}

.car h3 {
  margin: 8px;
}

.car button {
  width: 100%;
  padding: 12px;
  border: 0;
  border-radius: 10px;
  background: #087cff;
  color: white;
  font-size: 18px;
}

#selectedCar {
  margin: 10px;
  font-size: 20px;
}

#startGame {
  padding: 15px 35px;
  font-size: 21px;
  border: 0;
  border-radius: 12px;
  background: #16a34a;
  color: white;
  margin: 10px;
}

/* =========================
   اللعبة
========================= */

#gameScreen {
  display: none;
}

#info {
  display: flex;
  justify-content: center;
  gap: 18px;
  font-size: 18px;
  margin: 8px;
}

#game {
  width: 95%;
  max-width: 500px;
  height: 500px;
  margin: auto;
  position: relative;
  overflow: hidden;
  border: 3px solid #08f;
  border-radius: 12px;

  background:
    repeating-linear-gradient(
      to right,
      #292929 0px,
      #292929 100px,
      #252525 100px,
      #252525 200px
    );
}

#game::before,
#game::after {
  content: "";
  position: absolute;
  top: 0;
  width: 7px;
  height: 100%;
  background: white;
  z-index: 2;
}

#game::before {
  left: 18px;
}

#game::after {
  right: 18px;
}

.line {
  position: absolute;
  width: 7px;
  height: 65px;
  background: white;
  top: -100px;
  opacity: .8;
  z-index: 1;
}

/* العربية التي اخترتها */
#player {
  position: absolute;
  bottom: 20px;
  left: 45%;
  width: 70px;
  height: 90px;
  object-fit: cover;
  border-radius: 10px;
  border: 3px solid white;
  z-index: 10;
}

/* السيارات المنافسة */
.enemy {
  position: absolute;
  width: 55px;
  height: 85px;
  background: linear-gradient(#ffd92f, #d99d00);
  border-radius: 12px;
  border: 3px solid #111;
  z-index: 5;
}

.enemy::before {
  content: "";
  position: absolute;
  top: 9px;
  left: 8px;
  width: 30px;
  height: 23px;
  background: #222;
  border-radius: 6px;
}

/* العملة */
.coin {
  position: absolute;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: gold;
  border: 3px solid white;
  color: #7a5200;
  font-weight: bold;
  font-size: 18px;
  line-height: 24px;
  z-index: 6;
}

/* الأزرار */
.controls {
  width: 95%;
  max-width: 500px;
  margin: 10px auto;
  display: flex;
  gap: 15px;
}

.control {
  flex: 1;
  padding: 17px;
  font-size: 28px;
  border: 0;
  border-radius: 15px;
  background: #087cff;
  color: white;
  touch-action: manipulation;
}

#backGarage {
  padding: 10px 20px;
  border: 0;
  border-radius: 10px;
  background: #555;
  color: white;
  font-size: 17px;
}

/* شاشة الخسارة */
#gameOver {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.88);
  z-index: 50;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

#gameOver h2 {
  font-size: 36px;
}

#restart {
  padding: 13px 25px;
  border: 0;
  border-radius: 10px;
  background: #087cff;
  color: white;
  font-size: 19px;
}
</style>
</head>

<body>

<!-- =========================
     الجراج
========================= -->

<div id="garage">

  <h1>🏎️ جراج السيارات</h1>

  <h2>اختر سيارتك 🚗</h2>

  <div class="cars">

    <div class="car selected" id="car1Box">

      <img src="car1.jpg">

      <h3>🖤 السيارة السوداء</h3>

      <button onclick="selectCar(1)">
        اختيار السيارة
      </button>

    </div>


    <div class="car" id="car2Box">

      <img src="car2.jpg">

      <h3>🤍 السيارة الفضية</h3>

      <button onclick="selectCar(2)">
        اختيار السيارة
      </button>

    </div>

  </div>

  <div id="selectedCar">
    السيارة المختارة: 🖤 السوداء
  </div>

  <button id="startGame" onclick="startGame()">
    🏁 ابدأ السباق
  </button>

</div>


<!-- =========================
     شاشة اللعبة
========================= -->

<div id="gameScreen">

  <h1>🏁 السباق</h1>

  <div id="info">
    <span id="score">🏆 0</span>
    <span id="coins">🪙 0</span>
    <span id="lives">❤️❤️❤️</span>
  </div>

  <button id="backGarage" onclick="backToGarage()">
    🚗 الجراج
  </button>

  <div id="game">

    <div id="gameOver">

      <h2>💥 انتهى السباق!</h2>

      <div id="finalScore">
        النقاط: 0
      </div>

      <div id="finalCoins">
        العملات: 0
      </div>

      <button id="restart" onclick="startGame()">
        🔄 العب مرة أخرى
      </button>

    </div>

  </div>

  <div class="controls">

    <button class="control" id="left">
      ⬅️
    </button>

    <button class="control" id="right">
      ➡️
    </button>

  </div>

</div>


<script>

/* =========================
   اختيار السيارة
========================= */

let selectedCar = 1;

function selectCar(number) {

  selectedCar = number;

  document
    .querySelectorAll(".car")
    .forEach(car => car.classList.remove("selected"));

  document
    .getElementById("car" + number + "Box")
    .classList.add("selected");

  if (number === 1) {

    document.getElementById("selectedCar").textContent =
      "السيارة المختارة: 🖤 السوداء";

  } else {

    document.getElementById("selectedCar").textContent =
      "السيارة المختارة: 🤍 الفضية";

  }
}


/* =========================
   عناصر اللعبة
========================= */

const game = document.getElementById("game");

const scoreText =
  document.getElementById("score");

const coinsText =
  document.getElementById("coins");

const livesText =
  document.getElementById("lives");

const gameOver =
  document.getElementById("gameOver");

const finalScore =
  document.getElementById("finalScore");

const finalCoins =
  document.getElementById("finalCoins");

const leftButton =
  document.getElementById("left");

const rightButton =
  document.getElementById("right");

let player;

let enemies = [];
let coins = [];
let lines = [];

let score = 0;
let coinCount = 0;
let lives = 3;

let speed = 4;

let gameRunning = false;

let moveLeft = false;
let moveRight = false;

let animation;
let enemyTimer;
let coinTimer;


/* =========================
   بدء اللعبة
========================= */

function startGame() {

  document.getElementById("garage").style.display = "none";

  document.getElementById("gameScreen").style.display = "block";

  gameRunning = true;

  score = 0;
  coinCount = 0;
  lives = 3;
  speed = 4;

  scoreText.textContent = "🏆 0";
  coinsText.textContent = "🪙 0";
  livesText.textContent = "❤️❤️❤️";

  gameOver.style.display = "none";

  clearTimeout(enemyTimer);
  clearTimeout(coinTimer);

  document
    .querySelectorAll(".enemy")
    .forEach(e => e.remove());

  document
    .querySelectorAll(".coin")
    .forEach(e => e.remove());

  document
    .querySelectorAll(".line")
    .forEach(e => e.remove());

  document
    .querySelectorAll("#player")
    .forEach(e => e.remove());

  enemies = [];
  coins = [];
  lines = [];


  /* إنشاء صورة اللاعب */

  player = document.createElement("img");

  player.id = "player";

  if (selectedCar === 1) {

    player.src = "car1.jpg";

  } else {

    player.src = "car2.jpg";

  }

  game.appendChild(player);


  /* خطوط الطريق */

  for (let i = 0; i < 7; i++) {

    const line1 =
      document.createElement("div");

    line1.className = "line";

    line1.style.left = "33%";

    line1.style.top =
      (i * 90 - 100) + "px";

    game.appendChild(line1);

    lines.push(line1);


    const line2 =
      document.createElement("div");

    line2.className = "line";

    line2.style.left = "66%";

    line2.style.top =
      (i * 90 - 100) + "px";

    game.appendChild(line2);

    lines.push(line2);
  }


  createEnemy();

  createCoin();

  animation =
    requestAnimationFrame(gameLoop);
}


/* =========================
   سيارة منافسة
========================= */

function createEnemy() {

  if (!gameRunning) return;

  const enemy =
    document.createElement("div");

  enemy.className = "enemy";

  const maxLeft =
    game.clientWidth - 80;

  enemy.style.left =
    Math.floor(
      25 + Math.random() * (maxLeft - 25)
    ) + "px";

  enemy.style.top = "-100px";

  game.appendChild(enemy);

  enemies.push(enemy);

  enemyTimer =
    setTimeout(
      createEnemy,
      Math.max(450, 1100 - score * 8)
    );
}


/* =========================
   العملات
========================= */

function createCoin() {

  if (!gameRunning) return;

  const coin =
    document.createElement("div");

  coin.className = "coin";

  coin.textContent = "$";

  coin.style.left =
    Math.floor(
      Math.random() *
      (game.clientWidth - 40)
    ) + "px";

  coin.style.top = "-50px";

  game.appendChild(coin);

  coins.push(coin);

  coinTimer =
    setTimeout(createCoin, 1300);
}


/* =========================
   اللعبة
========================= */

function gameLoop() {

  if (!gameRunning) return;


  /* حركة اللاعب */

  let left = player.offsetLeft;

  if (moveLeft)
    left -= 8;

  if (moveRight)
    left += 8;

  const maxLeft =
    game.clientWidth -
    player.offsetWidth -
    20;

  if (left < 20)
    left = 20;

  if (left > maxLeft)
    left = maxLeft;

  player.style.left =
    left + "px";


  /* خطوط الطريق */

  lines.forEach(line => {

    let top =
      line.offsetTop + speed;

    if (top > game.clientHeight)
      top = -80;

    line.style.top =
      top + "px";
  });


  /* السيارات */

  enemies.forEach((enemy, index) => {

    let top =
      enemy.offsetTop + speed;

    enemy.style.top =
      top + "px";


    if (top > game.clientHeight) {

      enemy.remove();

      enemies.splice(index, 1);

      score++;

      scoreText.textContent =
        "🏆 " + score;

      if (score % 5 === 0)
        speed += .5;
    }


    if (isColliding(player, enemy)) {

      enemy.remove();

      enemies.splice(index, 1);

      loseLife();
    }

  });


  /* العملات */

  coins.forEach((coin, index) => {

    let top
