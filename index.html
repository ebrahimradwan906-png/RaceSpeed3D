<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🏎️ سباق الشوارع</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow: hidden;
}

h1 {
  margin: 8px 0;
  font-size: 26px;
}

#info {
  display: flex;
  justify-content: center;
  gap: 18px;
  font-size: 18px;
  margin-bottom: 8px;
}

#game {
  width: 95%;
  max-width: 500px;
  height: 500px;
  margin: auto;
  position: relative;
  overflow: hidden;
  border: 3px solid #08f;
  border-radius: 12px;

  background:
    repeating-linear-gradient(
      to right,
      #292929 0px,
      #292929 100px,
      #252525 100px,
      #252525 200px
    );
}

/* حواف الطريق */
#game::before,
#game::after {
  content: "";
  position: absolute;
  top: 0;
  width: 8px;
  height: 100%;
  background: #fff;
  z-index: 2;
}

#game::before {
  left: 18px;
}

#game::after {
  right: 18px;
}

/* خطوط الطريق */
.line {
  position: absolute;
  width: 7px;
  height: 65px;
  background: white;
  top: -100px;
  opacity: .8;
  z-index: 1;
}

/* اللاعب */
#player {
  position: absolute;
  bottom: 20px;
  left: 45%;
  width: 52px;
  height: 82px;
  background: linear-gradient(#ff3333, #a90000);
  border-radius: 12px 12px 7px 7px;
  border: 3px solid white;
  z-index: 10;
  box-shadow: 0 0 12px rgba(255,0,0,.7);
}

/* زجاج */
#player::before {
  content: "";
  position: absolute;
  top: 9px;
  left: 8px;
  width: 30px;
  height: 23px;
  background: linear-gradient(#baf1ff, #2588aa);
  border-radius: 6px;
  border: 2px solid #111;
}

/* العجلات */
#player::after {
  content: "●     ●";
  position: absolute;
  color: #111;
  font-size: 22px;
  bottom: 5px;
  left: -4px;
  white-space: nowrap;
}

/* السيارات */
.enemy {
  position: absolute;
  width: 52px;
  height: 82px;
  background: linear-gradient(#ffd92f, #d99d00);
  border-radius: 12px;
  border: 3px solid #111;
  z-index: 5;
  box-shadow: 0 0 8px rgba(255,220,0,.5);
}

.enemy::before {
  content: "";
  position: absolute;
  top: 9px;
  left: 8px;
  width: 30px;
  height: 23px;
  background: #222;
  border-radius: 6px;
}

/* العملة */
.coin {
  position: absolute;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: gold;
  border: 3px solid #fff2a0;
  color: #7a5200;
  font-weight: bold;
  font-size: 18px;
  line-height: 24px;
  z-index: 6;
}

/* الأزرار */
#play,
#restart {
  padding: 13px 26px;
  font-size: 20px;
  border: 0;
  border-radius: 12px;
  background: #087cff;
  color: white;
  margin: 6px;
  cursor: pointer;
}

/* شاشة الخسارة */
#gameOver {
  display: none;
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,.86);
  z-index: 50;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

#gameOver h2 {
  font-size: 38px;
  margin: 8px;
}

#finalScore {
  font-size: 22px;
  margin: 8px;
}

/* أزرار الهاتف */
.controls {
  width: 95%;
  max-width: 500px;
  margin: 10px auto;
  display: flex;
  gap: 15px;
}

.control {
  flex: 1;
  padding: 16px;
  font-size: 28px;
  border: 0;
  border-radius: 15px;
  background: #087cff;
  color: white;
  user-select: none;
  touch-action: manipulation;
}

.control:active {
  transform: scale(.95);
  background: #005dcc;
}
</style>
</head>

<body>

<h1>🏎️ سباق الشوارع</h1>

<div id="info">
  <span id="score">🏆 0</span>
  <span id="coins">🪙 0</span>
  <span id="lives">❤️❤️❤️</span>
</div>

<button id="play">▶️ ابدأ اللعب</button>

<div id="game">

  <div id="gameOver">
    <h2>💥 انتهت اللعبة!</h2>
    <div id="finalScore">النقاط: 0</div>
    <div id="finalCoins">العملات: 0</div>
    <button id="restart">🔄 العب مرة أخرى</button>
  </div>

</div>

<div class="controls">
  <button class="control" id="left">⬅️</button>
  <button class="control" id="right">➡️</button>
</div>

<script>

const game = document.getElementById("game");
const play = document.getElementById("play");
const restart = document.getElementById("restart");

const scoreText = document.getElementById("score");
const coinsText = document.getElementById("coins");
const livesText = document.getElementById("lives");

const gameOver = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");
const finalCoins = document.getElementById("finalCoins");

const leftButton = document.getElementById("left");
const rightButton = document.getElementById("right");

let player;
let enemies = [];
let coins = [];
let lines = [];

let score = 0;
let coinCount = 0;
let lives = 3;

let speed = 4;
let gameRunning = false;

let moveLeft = false;
let moveRight = false;

let animation;
let enemyTimer;
let coinTimer;


/* بدء اللعبة */
function startGame() {

  gameRunning = true;

  score = 0;
  coinCount = 0;
  lives = 3;
  speed = 4;

  scoreText.textContent = "🏆 0";
  coinsText.textContent = "🪙 0";
  livesText.textContent = "❤️❤️❤️";

  play.style.display = "none";
  gameOver.style.display = "none";

  clearTimeout(enemyTimer);
  clearTimeout(coinTimer);

  document.querySelectorAll(".enemy").forEach(e => e.remove());
  document.querySelectorAll(".coin").forEach(e => e.remove());
  document.querySelectorAll(".line").forEach(e => e.remove());
  document.querySelectorAll("#player").forEach(e => e.remove());

  enemies = [];
  coins = [];
  lines = [];

  /* إنشاء اللاعب */
  player = document.createElement("div");
  player.id = "player";
  game.appendChild(player);

  /* إنشاء خطوط الطريق */
  for (let i = 0; i < 7; i++) {

    const line = document.createElement("div");

    line.className = "line";

    line.style.left = "33%";
    line.style.top = (i * 90 - 100) + "px";

    game.appendChild(line);
    lines.push(line);

    const line2 = document.createElement("div");

    line2.className = "line";

    line2.style.left = "66%";
    line2.style.top = (i * 90 - 100) + "px";

    game.appendChild(line2);
    lines.push(line2);
  }

  createEnemy();
  createCoin();

  animation = requestAnimationFrame(gameLoop);
}


/* إنشاء سيارة */
function createEnemy() {

  if (!gameRunning) return;

  const enemy = document.createElement("div");

  enemy.className = "enemy";

  const minLeft = 25;
  const maxLeft = game.clientWidth - 80;

  enemy.style.left =
    Math.floor(
      minLeft + Math.random() * (maxLeft - minLeft)
    ) + "px";

  enemy.style.top = "-100px";

  game.appendChild(enemy);
  enemies.push(enemy);

  enemyTimer = setTimeout(
    createEnemy,
    Math.max(400, 1000 - score * 8)
  );
}


/* إنشاء عملة */
function createCoin() {

  if (!gameRunning) return;

  const coin = document.createElement("div");

  coin.className = "coin";
  coin.textContent = "$";

  const maxLeft = game.clientWidth - 55;

  coin.style.left =
    Math.floor(Math.random() * maxLeft) + "px";

  coin.style.top = "-50px";

  game.appendChild(coin);
  coins.push(coin);

  coinTimer = setTimeout(createCoin, 1300);
}


/* الحلقة الرئيسية */
function gameLoop() {

  if (!gameRunning) return;

  /* حركة اللاعب */
  let playerLeft = player.offsetLeft;

  if (moveLeft) {
    playerLeft -= 8;
  }

  if (moveRight) {
    playerLeft += 8;
  }

  const maxLeft =
    game.clientWidth - player.offsetWidth - 20;

  if (playerLeft < 20) {
    playerLeft = 20;
  }

  if (playerLeft > maxLeft) {
    playerLeft = maxLeft;
  }

  player.style.left = playerLeft + "px";


  /* حركة الخطوط */
  lines.forEach(line => {

    let top = line.offsetTop;

    top += speed;

    if (top > game.clientHeight) {
      top = -80;
    }

    line.style.top = top + "px";
  });


  /* حركة السيارات */
  enemies.forEach((enemy, index) => {

    let top = enemy.offsetTop;

    top += speed;

    enemy.style.top = top + "px";

    if (top > game.clientHeight) {

      enemy.remove();
      enemies.splice(index, 1);

      score++;

      scoreText.textContent =
        "🏆 " + score;

      if (score % 5 === 0) {
        speed += 0.5;
      }
    }

    /* تصادم */
    if (isColliding(player, enemy)) {

      enemy.remove();
      enemies.splice(index, 1);

      loseLife();
    }
  });


  /* حركة العملات */
  coins.forEach((coin, index) => {

    let top = coin.offsetTop;

    top += speed;

    coin.style.top = top + "px";

    if (top > game.clientHeight) {

      coin.remove();
      coins.splice(index, 1);
    }

    /* جمع العملة */
    if (isColliding(player, coin)) {

      coin.remove();
      coins.splice(index, 1);

      coinCount++;

      coinsText.textContent =
        "🪙 " + coinCount;
    }
  });


  animation = requestAnimationFrame(gameLoop);
}


/* خسارة حياة */
function loseLife() {

  lives--;

  livesText.textContent =
    "❤️".repeat(lives) +
    "🖤".repeat(3 - lives);

  if (lives <= 0) {
    endGame();
  }
}


/* التصادم */
function isColliding(a, b) {

  if (!a || !b) return false;

  const aRect = a.getBoundingClientRect();
  const bRect = b.getBoundingClientRect();

  return !(
    aRect.bottom < bRect.top ||
    aRect.top > bRect.bottom ||
    aRect.right < bRect.left ||
    aRect.left > bRect.right
  );
}


/* نهاية اللعبة */
function endGame() {

  gameRunning = false;

  cancelAnimationFrame(animation);

  clearTimeout(enemyTimer);
  clearTimeout(coinTimer);

  finalScore.textContent =
    "🏆 النقاط: " + score;

  finalCoins.textContent =
    "🪙 العملات: " + coinCount;

  gameOver.style.display = "flex";
}


/* بدء */
play.onclick = startGame;


/* إعادة */
restart.onclick = startGame;


/* لوحة المفاتيح */
document.addEventListener("keydown", function(e) {

  if (e.key === "ArrowLeft") {
    moveLeft = true;
  }

  if (e.key === "ArrowRight") {
    moveRight = true;
  }

});


document.addEventListener("keyup", function(e) {

  if (e.key === "ArrowLeft") {
    moveLeft = false;
  }

  if (e.key === "ArrowRight") {
    moveRight = false;
  }

});


/* الهاتف */
leftButton.addEventListener(
  "touchstart",
  function(e) {
    e.preventDefault();
    moveLeft = true;
  },
  { passive: false }
);

leftButton.addEventListener(
  "touchend",
  function(e) {
    e.preventDefault();
    moveLeft = false;
  },
  { passive: false }
);

rightButton.addEventListener(
  "touchstart",
  function(e) {
    e.preventDefault();
    moveRight = true;
  },
  { passive: false }
);

rightButton.addEventListener(
  "touchend",
  function(e) {
    e.preventDefault();
    moveRight = false;
  },
  { passive: false }
);


/* الضغط بالماوس */
leftButton.onmousedown = () => moveLeft = true;
leftButton.onmouseup = () => moveLeft = false;

rightButton.onmousedown = () => moveRight = true;
rightButton.onmouseup = () => moveRight = false;

</script>

</body>
</html>
