<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🚗 سباق السيارات</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #080808, #202020);
  color: white;
  text-align: center;
}

h1 {
  margin: 20px 0 5px;
  color: #00eaff;
}

.subtitle {
  color: #aaa;
  margin-bottom: 20px;
}

/* الجراج */
#garage {
  padding: 20px;
}

.cars {
  display: flex;
  justify-content: center;
  gap: 20px;
  flex-wrap: wrap;
}

/* كارت العربية */
.car-card {
  width: min(90vw, 380px);
  background: #151515;
  border: 3px solid #333;
  border-radius: 20px;
  padding: 12px;
  cursor: pointer;
  transition: 0.25s;
  box-shadow: 0 8px 25px rgba(0,0,0,.5);
}

.car-card:hover {
  transform: translateY(-8px);
  border-color: #00eaff;
}

.car-card.selected {
  border-color: #00ff66;
  box-shadow: 0 0 25px #00ff66;
  transform: scale(1.03);
}

.car-card img {
  width: 100%;
  height: 230px;
  object-fit: cover;
  border-radius: 14px;
}

.car-name {
  font-size: 22px;
  font-weight: bold;
  margin: 12px 0;
}

.select-text {
  color: #aaa;
}

/* زر البداية */
#startBtn {
  margin-top: 25px;
  padding: 15px 40px;
  font-size: 20px;
  font-weight: bold;
  color: white;
  background: #00aaff;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  display: none;
}

#startBtn:hover {
  background: #00ddff;
}

/* السباق */
#race {
  display: none;
  padding: 20px;
}

.track {
  position: relative;
  width: 100%;
  max-width: 900px;
  height: 350px;
  margin: 20px auto;
  overflow: hidden;
  border: 4px solid white;
  border-radius: 15px;
  background:
    repeating-linear-gradient(
      90deg,
      #333 0px,
      #333 50px,
      #444 50px,
      #444 100px
    );
}

.finish {
  position: absolute;
  right: 30px;
  top: 0;
  width: 10px;
  height: 100%;
  background: repeating-linear-gradient(
    0deg,
    white 0px,
    white 20px,
    black 20px,
    black 40px
  );
}

.race-car {
  position: absolute;
  left: 20px;
  width: 120px;
  border-radius: 10px;
  transition: left 0.1s linear;
}

#playerCar {
  top: 70px;
}

#enemyCar {
  top: 220px;
}

.controls {
  margin-top: 15px;
}

.controls button {
  padding: 15px 25px;
  margin: 5px;
  border: none;
  border-radius: 10px;
  font-size: 20px;
  cursor: pointer;
}

#gas {
  background: #00cc55;
  color: white;
}

#backGarage {
  background: #555;
  color: white;
}
</style>
</head>

<body>

<!-- ================= الجراج ================= -->

<section id="garage">

  <h1>🏁 جراج السيارات</h1>

  <div class="subtitle">
    اختر السيارة التي تريد السباق بها
  </div>

  <div class="cars">

    <!-- العربية الأولى -->
    <div class="car-card" onclick="selectCar(1, this)">
      <img src="images/car1.jpg" alt="السيارة الأولى">
      <div class="car-name">🚗 Mercedes SLS</div>
      <div class="select-text">اضغط لاختيار السيارة</div>
    </div>

    <!-- العربية الثانية -->
    <div class="car-card" onclick="selectCar(2, this)">
      <img src="images/car2.jpg" alt="السيارة الثانية">
      <div class="car-name">🏎️ Mercedes AMG</div>
      <div class="select-text">اضغط لاختيار السيارة</div>
    </div>

  </div>

  <button id="startBtn" onclick="startRace()">
    🏁 ابدأ السباق
  </button>

</section>


<!-- ================= السباق ================= -->

<section id="race">

  <h1>🏁 السباق بدأ!</h1>

  <div id="selectedName"></div>

  <div class="track">

    <div class="finish"></div>

    <img id="playerCar" class="race-car">

    <img
      id="enemyCar"
      class="race-car"
      src="images/car2.jpg"
    >

  </div>

  <div class="controls">

    <button id="gas" onclick="accelerate()">
      🟢 بنزين
    </button>

    <button id="backGarage" onclick="backToGarage()">
      🔙 الجراج
    </button>

  </div>

</section>


<script>

let selectedCar = null;
let playerPosition = 20;
let enemyPosition = 20;


/* اختيار السيارة */
function selectCar(carNumber, element) {

  selectedCar = carNumber;

  // إزالة التحديد من كل السيارات
  document.querySelectorAll(".car-card").forEach(card => {
    card.classList.remove("selected");
  });

  // تحديد السيارة
  element.classList.add("selected");

  // إظهار زر البداية
  document.getElementById("startBtn").style.display = "inline-block";
}


/* بدء السباق */
function startRace() {

  if (!selectedCar) {
    alert("اختار عربية الأول 🚗");
    return;
  }

  document.getElementById("garage").style.display = "none";
  document.getElementById("race").style.display = "block";

  let playerCar = document.getElementById("playerCar");

  if (selectedCar === 1) {
    playerCar.src = "images/car1.jpg";
    document.getElementById("selectedName").innerText =
      "أنت تقود Mercedes SLS 🚗";
  } else {
    playerCar.src = "images/car2.jpg";
    document.getElementById("selectedName").innerText =
      "أنت تقود Mercedes AMG 🏎️";
  }

  playerPosition = 20;
  enemyPosition = 20;

  playerCar.style.left = playerPosition + "px";
  document.getElementById("enemyCar").style.left =
    enemyPosition + "px";

  // بداية حركة الخصم
  moveEnemy();
}


/* البنزين */
function accelerate() {

  playerPosition += 25;

  let trackWidth =
    document.querySelector(".track").clientWidth;

  let carWidth = 120;

  if (playerPosition > trackWidth - carWidth - 30) {
    playerPosition = trackWidth - carWidth - 30;
  }

  document.getElementById("playerCar").style.left =
    playerPosition + "px";

  checkWinner();
}


/* حركة الخصم */
function moveEnemy() {

  if (
    document.getElementById("race").style.display === "none"
  ) {
    return;
  }

  enemyPosition += Math.random() * 12;

  let trackWidth =
    document.querySelector(".track").clientWidth;

  let carWidth = 120;

  if (enemyPosition > trackWidth - carWidth - 30) {
    enemyPosition = trackWidth - carWidth - 30;
  }

  document.getElementById("enemyCar").style.left =
    enemyPosition + "px";

  checkWinner();

  setTimeout(moveEnemy, 400);
}


/* تحديد الفائز */
function checkWinner() {

  let trackWidth =
    document.querySelector(".track").clientWidth;

  let finish =
    trackWidth - 170;

  if (playerPosition >= finish) {

    alert("🏆 فزت بالسباق!");

    backToGarage();

  } else if (enemyPosition >= finish) {

    alert("😢 خسرت! حاول مرة أخرى");

    backToGarage();
  }
}


/* الرجوع للجراج */
function backToGarage() {

  document.getElementById("race").style.display = "none";
  document.getElementById("garage").style.display = "block";

  playerPosition = 20;
  enemyPosition = 20;
}

</script>

</body>
</html>
